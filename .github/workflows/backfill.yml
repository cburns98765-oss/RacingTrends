name: Backfill history

# Run by hand (Actions tab -> Backfill history -> Run workflow) to load past seasons.
# Each quarter of each year/region is its own job (rpscrape-community is rate limited, so a whole
# year would outlast GitHub's 6-hour job limit). Parts are merged into data/history/races.csv.gz.
# Safe to re-run: races already in the history are just updated.
on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "First year"
        default: "2016"
      to_year:
        description: "Last year (the current year stops at yesterday)"
        default: "2026"
      regions:
        description: "Regions"
        default: "gb ire"
      parallel:
        description: "Jobs at once (each runs on its own GitHub server)"
        default: "6"

permissions:
  contents: write

concurrency:
  group: racing-data
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, datetime
          f, t = int("${{ inputs.from_year }}"), int("${{ inputs.to_year }}")
          regions = "${{ inputs.regions }}".split()
          yday = (datetime.date.today() - datetime.timedelta(days=1)).isoformat()
          q = [("01-01", "03-31"), ("04-01", "06-30"), ("07-01", "09-30"), ("10-01", "12-31")]
          inc = []
          for y in range(t, f - 1, -1):
              for i, (a, b) in enumerate(q, 1):
                  start, end = f"{y}-{a}", min(f"{y}-{b}", yday)
                  if start > yday:
                      continue
                  for r in regions:
                      inc.append({"label": f"{y}-Q{i}", "start": start, "end": end, "region": r})
          print("matrix=" + json.dumps({"include": inc}))
          EOF

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scrape ${{ matrix.region }} ${{ matrix.label }}
        env:
          REGIONS: ${{ matrix.region }}
        run: |
          bash scripts/rp.sh setup
          bash scripts/rp.sh results "${{ matrix.start }}" "${{ matrix.end }}"
          ls -la work
          python3 -m trends --history "part_${{ matrix.region }}_${{ matrix.label }}.csv.gz" history work/results_*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.region }}-${{ matrix.label }}
          path: part_*.csv.gz
          retention-days: 7

  merge:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: parts
      - name: Merge into history
        run: |
          ls -la parts || true
          python3 -m trends merge parts/*.csv.gz
      - name: Commit
        run: |
          git config user.name "racing-trends-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "History backfill ${{ inputs.from_year }}-${{ inputs.to_year }}"
          git pull --rebase --autostash && git push
